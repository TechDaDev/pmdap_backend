services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmdap}
      POSTGRES_USER: ${POSTGRES_USER:-pmdap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    environment: &app-environment
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-pmdap}
      POSTGRES_USER: ${POSTGRES_USER:-pmdap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_CACHE_URL: redis://redis:6379/2
      IDENTITY_FILE_ROOT: /var/lib/pmdap/identity
      IDENTITY_FILE_MAX_BYTES: ${IDENTITY_FILE_MAX_BYTES:-10485760}
      MEDICAL_FILE_ROOT: /var/lib/pmdap/medical
      MEDICAL_FILE_MAX_BYTES: ${MEDICAL_FILE_MAX_BYTES:-26214400}
      MEDICAL_IMAGE_MAX_PIXELS: ${MEDICAL_IMAGE_MAX_PIXELS:-40000000}
      PDF_TEXT_MIN_CHARS: ${PDF_TEXT_MIN_CHARS:-80}
      PDF_TEXT_MIN_PAGE_CHARS: ${PDF_TEXT_MIN_PAGE_CHARS:-40}
      PDF_TEXT_MIN_TEXT_PAGE_RATIO: ${PDF_TEXT_MIN_TEXT_PAGE_RATIO:-0.5}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-250}
      PDF_EXTRACTION_MAX_RETRIES: ${PDF_EXTRACTION_MAX_RETRIES:-3}
      PDF_EXTRACTION_RETRY_BASE_SECONDS: ${PDF_EXTRACTION_RETRY_BASE_SECONDS:-5}
      PDF_EXTRACTION_SOFT_TIME_LIMIT: ${PDF_EXTRACTION_SOFT_TIME_LIMIT:-1500}
      PDF_EXTRACTION_TIME_LIMIT: ${PDF_EXTRACTION_TIME_LIMIT:-1800}
      OCR_ENGINE: ${OCR_ENGINE:-paddleocr}
      OCR_TEXT_DETECTION_MODEL_NAME: ${OCR_TEXT_DETECTION_MODEL_NAME:-PP-OCRv5_mobile_det}
      OCR_TEXT_RECOGNITION_MODEL_NAME: ${OCR_TEXT_RECOGNITION_MODEL_NAME:-arabic_PP-OCRv5_mobile_rec}
      OCR_TEXT_DETECTION_MODEL_DIR: ${OCR_TEXT_DETECTION_MODEL_DIR:-}
      OCR_TEXT_RECOGNITION_MODEL_DIR: ${OCR_TEXT_RECOGNITION_MODEL_DIR:-}
      OCR_PDF_RENDER_DPI: ${OCR_PDF_RENDER_DPI:-300}
      OCR_PDF_RENDER_MAX_DPI: ${OCR_PDF_RENDER_MAX_DPI:-400}
      OCR_MAX_IMAGE_PIXELS: ${OCR_MAX_IMAGE_PIXELS:-20000000}
      OCR_MAX_WIDTH: ${OCR_MAX_WIDTH:-6000}
      OCR_MAX_HEIGHT: ${OCR_MAX_HEIGHT:-6000}
      OCR_MAX_TEXT_CHARS_PER_PAGE: ${OCR_MAX_TEXT_CHARS_PER_PAGE:-100000}
      OCR_MAX_TEXT_CHARS_PER_DOCUMENT: ${OCR_MAX_TEXT_CHARS_PER_DOCUMENT:-2000000}
      OCR_TEXT_MIN_MEANINGFUL_CHARS: ${OCR_TEXT_MIN_MEANINGFUL_CHARS:-1}
      OCR_TASK_MAX_RETRIES: ${OCR_TASK_MAX_RETRIES:-3}
      OCR_TASK_RETRY_BASE_SECONDS: ${OCR_TASK_RETRY_BASE_SECONDS:-10}
      OCR_TASK_SOFT_TIME_LIMIT: ${OCR_TASK_SOFT_TIME_LIMIT:-1500}
      OCR_TASK_TIME_LIMIT: ${OCR_TASK_TIME_LIMIT:-1800}
      DATE_CONTEXT_MAX_CHARS: ${DATE_CONTEXT_MAX_CHARS:-160}
      DATE_SUGGESTION_MIN_SCORE: ${DATE_SUGGESTION_MIN_SCORE:-0.75}
      DATE_SUGGESTION_TIE_TOLERANCE: ${DATE_SUGGESTION_TIE_TOLERANCE:-0.01}
      DATE_FUTURE_TOLERANCE_DAYS: ${DATE_FUTURE_TOLERANCE_DAYS:-14}
      DATE_MAX_CANDIDATES_PER_DOCUMENT: ${DATE_MAX_CANDIDATES_PER_DOCUMENT:-500}
      DATE_PIPELINE_VERSION: ${DATE_PIPELINE_VERSION:-m9-date-v2}
      DATE_TASK_MAX_RETRIES: ${DATE_TASK_MAX_RETRIES:-3}
      DATE_TASK_RETRY_BASE_SECONDS: ${DATE_TASK_RETRY_BASE_SECONDS:-5}
      DATE_TASK_SOFT_TIME_LIMIT: ${DATE_TASK_SOFT_TIME_LIMIT:-120}
      DATE_TASK_TIME_LIMIT: ${DATE_TASK_TIME_LIMIT:-180}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - identity_files:/var/lib/pmdap/identity
      - medical_files:/var/lib/pmdap/medical
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      target: ocr-worker
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=INFO",
        "--queues=celery,ocr",
        "--concurrency=${OCR_WORKER_CONCURRENCY:-1}",
      ]
    environment: *app-environment
    volumes:
      - .:/app
      - medical_files:/var/lib/pmdap/medical
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  identity_files:
  medical_files:
