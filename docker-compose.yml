services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmdap}
      POSTGRES_USER: ${POSTGRES_USER:-pmdap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
    environment: &app-environment
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-pmdap}
      POSTGRES_USER: ${POSTGRES_USER:-pmdap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DJANGO_CACHE_URL: redis://redis:6379/2
      IDENTITY_FILE_ROOT: /var/lib/pmdap/identity
      IDENTITY_FILE_MAX_BYTES: ${IDENTITY_FILE_MAX_BYTES:-10485760}
      MEDICAL_FILE_ROOT: /var/lib/pmdap/medical
      MEDICAL_FILE_MAX_BYTES: ${MEDICAL_FILE_MAX_BYTES:-26214400}
      MEDICAL_IMAGE_MAX_PIXELS: ${MEDICAL_IMAGE_MAX_PIXELS:-40000000}
      PDF_TEXT_MIN_CHARS: ${PDF_TEXT_MIN_CHARS:-80}
      PDF_TEXT_MIN_PAGE_CHARS: ${PDF_TEXT_MIN_PAGE_CHARS:-40}
      PDF_TEXT_MIN_TEXT_PAGE_RATIO: ${PDF_TEXT_MIN_TEXT_PAGE_RATIO:-0.5}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-250}
      PDF_EXTRACTION_MAX_RETRIES: ${PDF_EXTRACTION_MAX_RETRIES:-3}
      PDF_EXTRACTION_RETRY_BASE_SECONDS: ${PDF_EXTRACTION_RETRY_BASE_SECONDS:-5}
      PDF_EXTRACTION_SOFT_TIME_LIMIT: ${PDF_EXTRACTION_SOFT_TIME_LIMIT:-1500}
      PDF_EXTRACTION_TIME_LIMIT: ${PDF_EXTRACTION_TIME_LIMIT:-1800}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - identity_files:/var/lib/pmdap/identity
      - medical_files:/var/lib/pmdap/medical
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    environment: *app-environment
    volumes:
      - .:/app
      - medical_files:/var/lib/pmdap/medical
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  identity_files:
  medical_files:
