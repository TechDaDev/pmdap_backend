[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = tests
addopts =
    --strict-config
    --strict-markers
    --cov=.
    --cov-report=term-missing
    --cov-fail-under=90
markers =
    postgresql: requires and exercises a real PostgreSQL database
    real_ocr: runs the installed PaddleOCR CPU models against a synthetic image
